<!doctype html>
<meta charset="utf-8">
<!-- Renders to exactly 1200x630 for og:image. Copy is the page's own headline; no new claims. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#fbfaf8;
    font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:74px 82px 62px;
    position:relative;
  }
  /* left edge accent bar */
  body::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#8c2f26;
  }
  .mark {
    font-size:19px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:#8a929c;
  }
  .rule { width:64px; height:3px; background:#8c2f26; margin:0 0 30px; }
  h1 {
    font-family:'Newsreader',Georgia,serif;
    font-size:76px; font-weight:500; line-height:1.08; letter-spacing:-.02em;
    color:#14171a; max-width:19ch;
  }
  .foot {
    display:flex; justify-content:space-between; align-items:flex-end;
    border-top:1px solid #e7e3dd; padding-top:24px;
  }
  .who { font-family:'Newsreader',Georgia,serif; font-size:26px; color:#3d4650; }
  .where {
    font-size:16px; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
    color:#8a929c; text-align:right; line-height:1.7;
  }
</style>
<body>
  <div class="mark">ShoeMoney.com</div>

  <div>
    <div class="rule"></div>
    <h1>The Hudson at Austin Ranch Cost Me Millions</h1>
  </div>

  <div class="foot">
    <div class="who">Jeremy Schoemaker</div>
    <div class="where">
      The Hudson at Austin Ranch<br>
      The Billingsley Collection &bull; Carrollton, Texas
    </div>
  </div>
</body>
